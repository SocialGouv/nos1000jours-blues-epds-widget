# Single-package workspace file used for pnpm v10 supply-chain policies.

packages:
  - '.'

# Supply-chain hardening:
# - Delay any newly published versions to avoid 0-day compromised releases.
#   72j = 72 * 24 * 60 = 103680 minutes.
minimumReleaseAge: 103680

# Enforce trust evidence regression protection:
# Fail install if a package's trust level is downgraded.
trustPolicy: no-downgrade

# pnpm v10: install scripts are disabled by default. Only dependencies listed here
# are allowed to run their build scripts during installation.
onlyBuiltDependencies:
  # Keep this list empty unless we have a proven need for a package install script.
  # Rationale: pnpm v10 disables lifecycle scripts by default; we only allow the
  # minimum required for correct builds.
  []

# Dependencies explicitly kept blocked from running install scripts.
ignoredBuiltDependencies: []
